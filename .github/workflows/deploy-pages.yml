name: Publish BijakLearn to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-deployment
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate learning app
        run: npm test
      - name: Compile site for GitHub Pages
        run: npm run build
      - name: Install browser test tools
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check production browser flows before publishing
        run: node tests/browser-smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
