name: Validate and package
on:
  push:
    branches: [main, 'setup/**', 'feature/**', 'fix/**']
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bijaklearn-pwa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
